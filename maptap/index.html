<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map Drop</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--ink:#e6f0fb;--muted:#93a9c6;--green:#58e28a;--pink:#ff5a92;--gold:#ffd45a;--cyan:#5de3f9;--line:#3f5878;--panel:#0b1a2eee;--bg:#06121f}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:18px "Courier New",ui-monospace,monospace}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:#10213a;border:1px solid #5f7898;padding:8px 14px;min-height:40px;box-shadow:3px 3px 0 #02091680}
button:hover:not(:disabled){background:#17304f}button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #02091680}
button:disabled{opacity:.45;cursor:not-allowed}
button.go{background:var(--green);color:#04210f;border-color:#b9f7d0;font-weight:700;letter-spacing:1px}
button.go:hover:not(:disabled){background:#7af0a4}
button.danger{border-color:#c8587a;color:#ffb5cb}
button.sm{min-height:30px;padding:3px 9px;font-size:15px}
input,textarea,select{background:#07162a;border:1px solid var(--line);padding:8px 10px;width:100%;min-height:40px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
label{display:block;color:var(--muted);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 4px}
h1,h2,h3{margin:0 0 8px;letter-spacing:2px}h1{font-size:34px;color:#fff;text-shadow:3px 3px #0a2a40}
p{line-height:1.45;color:#c4d4ea}small{color:var(--muted)}
.shell{max-width:1100px;margin:auto;padding:18px 20px 44px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-weight:700;letter-spacing:4px;color:#fff}.brand span{color:var(--green)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:5px 5px 0 #02091699;padding:18px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{color:var(--cyan);font-size:15px;letter-spacing:1px;margin:6px 0 4px}
.eyebrow{color:var(--green);letter-spacing:3px;font-size:14px}
.hero{margin-top:22px;background-image:radial-gradient(circle at 85% 20%,#1b4a7a55,transparent 55%)}
/* play stage */
.stage{position:fixed;inset:0;background:#06121f}
.stage canvas,.edmap canvas,.mapwrap canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:crosshair}
.hud{position:absolute;left:10px;right:10px;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}
.top{top:10px;display:flex;gap:10px;align-items:flex-start}
.prompt{flex:1;background:var(--panel);border:1px solid var(--line);padding:8px 14px;min-width:0}
.prompt small{display:block;letter-spacing:1px}.prompt b{display:block;font-size:26px;color:#fff;overflow-wrap:anywhere}.prompt em{display:block;color:var(--gold);font-style:normal;font-size:15px}
.total{background:var(--panel);border:1px solid var(--line);padding:8px 12px;text-align:right;white-space:nowrap}.total b{font-size:22px;color:var(--gold);display:block}
.timer{position:relative;height:22px;background:#07162a;border:1px solid var(--line);margin-top:8px}.timer i{position:absolute;inset:0 auto 0 0;background:var(--pink);width:100%}.timer span{position:absolute;inset:0;text-align:center;font-size:14px;line-height:20px;color:#fff}
.bottom{bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);padding:10px 14px;left:10px;right:10px;flex-wrap:wrap}
.bottom span{color:#c4d4ea}
.res b{font-size:30px;color:var(--gold);margin-right:10px}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.overlay:not(:empty){background:#02091088;pointer-events:auto}
.card{max-width:440px;width:calc(100% - 32px);text-align:center}
.card h2{font-size:36px;overflow-wrap:anywhere}
/* editor */
.edgrid{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:16px;align-items:start}
.edmap{position:sticky;top:10px;height:calc(100vh - 20px);min-height:320px;border:1px solid var(--line);box-shadow:5px 5px 0 #02091699;position:sticky}
.edmap .maphint{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-size:15px;pointer-events:none}
.loc{border:1px solid var(--line);margin:8px 0;background:#08182b}
.loc>.head{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer}
.loc.sel{border-color:var(--gold)}.loc .n{color:var(--gold);min-width:26px}.loc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc .body{padding:4px 12px 12px;border-top:1px solid var(--line)}
.warn{color:var(--pink);font-size:14px}
.sug{display:flex;flex-direction:column;gap:3px;margin-top:4px}.sug button{text-align:left;min-height:32px;padding:4px 10px;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.tip{background:#08182b;border-left:3px solid var(--gold);padding:8px 12px;margin:10px 0;font-size:15px;color:#c4d4ea}
/* results */
.resgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mapwrap{padding:0;height:560px;position:relative;overflow:hidden}
.tabs{position:absolute;z-index:3;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.tabs button{min-height:30px;padding:2px 10px;background:var(--panel)}.tabs button.on{background:var(--gold);color:#222;border-color:#fff}
.lb{display:flex;align-items:center;gap:10px;margin:8px 0}.lb .rank{width:30px;color:var(--gold)}.lb .nm{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .bar{flex:1;height:18px;background:#07162a;border:1px solid var(--line)}.lb .bar i{display:block;height:100%}.lb .sc{width:62px;text-align:right}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:5px 6px;border-bottom:1px solid #1d3552;text-align:left}th{color:var(--muted)}td small{display:block}
@media(max-width:820px){.edgrid,.resgrid{grid-template-columns:1fr}.edmap{position:relative;height:60vh;order:-1}.mapwrap{height:60vh}.grid2{grid-template-columns:1fr}h1{font-size:26px}.prompt b{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

function validate(p){
  if(!p||typeof p!=='object'||p.format!=='map-drop')throw 'That is not a Map Drop game file.';
  const num=(v,d,lo,hi)=>{if(v===null||v===undefined||v==='')return d;v=Number(v);return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
  const rounds=(Array.isArray(p.rounds)?p.rounds:[]).slice(0,60).map(r=>({name:String(r&&r.name||'').slice(0,80),hint:String(r&&r.hint||'').slice(0,160),lat:num(r&&r.lat,null,-90,90),lon:num(r&&r.lon,null,-180,180)}));
  let view=null;if(p.view&&[p.view.lo0,p.view.la0,p.view.lo1,p.view.la1].every(v=>Number.isFinite(Number(v))))view={lo0:+p.view.lo0,la0:+p.view.la0,lo1:+p.view.lo1,la1:+p.view.la1};
  return{format:'map-drop',version:1,title:String(p.title||'Untitled game').slice(0,80),description:String(p.description||'').slice(0,400),halfKm:num(p.halfKm,1200,10,20000),perfectKm:num(p.perfectKm,30,0,2000),timer:Math.round(num(p.timer,0,0,300)),borders:p.borders!==false,view,rounds};
}

function hav(a,b,c,d){const R=6371,t=Math.PI/180,dl=(c-a)*t,dg=(d-b)*t;const x=Math.sin(dl/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}

/* ---------- map view (offline canvas map) ---------- */
class MapView{
  constructor(cv,o={}){
    this.cv=cv;this.g=cv.getContext('2d');this.o=o;this.w=300;this.h=300;this.cx=0;this.cy=0;this.k=2;this.dpr=1;
    this.pins=[];this.lines=[];this.borders=o.borders!==false;this.ptr=new Map();this.moved=0;this.t0=0;this.pd=0;this.dirty=true;this.dead=false;
    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(cv);
    cv.addEventListener('pointerdown',e=>this.down(e));cv.addEventListener('pointermove',e=>this.move(e));
    cv.addEventListener('pointerup',e=>this.up(e));cv.addEventListener('pointercancel',e=>this.up(e,true));
    cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();this.zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0016))},{passive:false});
    this.loop=()=>{if(this.dead)return;if(this.dirty){this.dirty=false;this.draw()}requestAnimationFrame(this.loop)};
    this.resize();this.world();this.loop();
  }
  destroy(){this.dead=true;this.ro.disconnect()}
  resize(){const r=this.cv.getBoundingClientRect();this.dpr=Math.min(2,window.devicePixelRatio||1);this.w=Math.max(50,r.width);this.h=Math.max(50,r.height);this.cv.width=Math.round(this.w*this.dpr);this.cv.height=Math.round(this.h*this.dpr);this.clamp();this.dirty=true}
  minK(){return Math.min(this.w/360,this.h/180)}
  clamp(){this.k=Math.min(60,Math.max(this.minK(),this.k));this.cx=Math.min(180,Math.max(-180,this.cx));this.cy=Math.min(90,Math.max(-90,this.cy))}
  world(){this.k=this.minK();this.cx=0;this.cy=8;this.clamp();this.dirty=true}
  geo(px,py){return[this.cx+(px-this.w/2)/this.k,this.cy-(py-this.h/2)/this.k]}
  scr(lon,lat){return[(lon-this.cx)*this.k+this.w/2,(this.cy-lat)*this.k+this.h/2]}
  bounds(){const a=this.geo(0,0),b=this.geo(this.w,this.h);return[a[0],b[1],b[0],a[1]]}
  fit(b,pad=70,maxK=40){const dw=Math.max(b[2]-b[0],.5),dh=Math.max(b[3]-b[1],.5);const k=Math.min((this.w-pad*2)/dw,(this.h-pad*2)/dh,maxK);return{cx:(b[0]+b[2])/2,cy:(b[1]+b[3])/2,k:Math.max(k,this.minK())}}
  set(v,anim){
    if(!anim){this.cx=v.cx;this.cy=v.cy;this.k=v.k;this.clamp();this.dirty=true;return}
    const a={cx:this.cx,cy:this.cy,k:this.k},t0=performance.now(),D=650;
    const step=now=>{if(this.dead)return;let t=Math.min(1,(now-t0)/D);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      this.cx=a.cx+(v.cx-a.cx)*t;this.cy=a.cy+(v.cy-a.cy)*t;this.k=Math.exp(Math.log(a.k)+(Math.log(Math.max(v.k,this.minK()))-Math.log(a.k))*t);this.clamp();this.dirty=true;if(t<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  }
  zoomAt(px,py,f){const b=this.geo(px,py);this.k*=f;this.clamp();this.cx=b[0]-(px-this.w/2)/this.k;this.cy=b[1]+(py-this.h/2)/this.k;this.clamp();this.dirty=true}
  pinch(){if(this.ptr.size<2)return 0;const[a,b]=[...this.ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)}
  down(e){try{this.cv.setPointerCapture(e.pointerId)}catch(x){}const r=this.cv.getBoundingClientRect();this.ptr.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});if(this.ptr.size===1){this.moved=0;this.t0=performance.now()}else this.moved=99;this.pd=this.pinch()}
  move(e){const p=this.ptr.get(e.pointerId);if(!p)return;const r=this.cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(this.ptr.size===1){const dx=x-p.x,dy=y-p.y;this.moved+=Math.abs(dx)+Math.abs(dy);if(this.moved>6){this.cx-=dx/this.k;this.cy+=dy/this.k;this.clamp();this.dirty=true}}
    p.x=x;p.y=y;
    if(this.ptr.size===2){const d=this.pinch(),[a,b]=[...this.ptr.values()];if(this.pd>0)this.zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/this.pd);this.pd=d}}
  up(e,cancel){const p=this.ptr.get(e.pointerId);this.ptr.delete(e.pointerId);
    if(this.ptr.size===0&&p&&!cancel&&this.moved<=6&&performance.now()-this.t0<800&&this.o.onTap){const g=this.geo(p.x,p.y);if(Math.abs(g[1])<=90&&Math.abs(g[0])<=180)this.o.onTap(g[0],g[1])}
    this.pd=this.pinch()}
  draw(){
    const g=this.g,{w,h,k,dpr}=this;
    g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#0a2238';g.fillRect(0,0,w,h);
    g.lineWidth=1;g.strokeStyle='#ffffff12';g.beginPath();
    for(let lo=-180;lo<=180;lo+=30){const x=this.scr(lo,0)[0];g.moveTo(x,this.scr(0,90)[1]);g.lineTo(x,this.scr(0,-90)[1])}
    for(let la=-90;la<=90;la+=30){const y=this.scr(0,la)[1];g.moveTo(this.scr(-180,0)[0],y);g.lineTo(this.scr(180,0)[0],y)}
    g.stroke();
    const s=k/20;g.save();g.setTransform(dpr*s,0,0,dpr*s,dpr*(w/2-(this.cx+180)*k),dpr*(h/2-(90-this.cy)*k));
    g.fillStyle='#2b4a3a';g.fill(LAND);g.lineJoin='round';g.lineWidth=(this.borders?1.2:1)/s;g.strokeStyle=this.borders?'#6f9a82':'#2b4a3a';g.stroke(LAND);g.restore();
    g.setTransform(dpr,0,0,dpr,0,0);
    for(const l of this.lines){const a=this.scr(l.a[0],l.a[1]),b=this.scr(l.b[0],l.b[1]);g.strokeStyle=l.color;g.lineWidth=2;g.setLineDash([7,6]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.setLineDash([])}
    g.font='bold 14px "Courier New",monospace';g.textBaseline='middle';
    for(const p of this.pins){const[x,y]=this.scr(p.lon,p.lat),r=p.r||8;g.fillStyle=p.color;g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();g.fillStyle='#000';g.globalAlpha=.55;g.beginPath();g.arc(x,y,2.5,0,7);g.fill();g.globalAlpha=1;
      if(p.label){g.lineWidth=4;g.strokeStyle='#06121f';g.strokeText(p.label,x+r+5,y);g.fillStyle='#fff';g.fillText(p.label,x+r+5,y)}}
  }
}

  app.innerHTML=`<div class="shell">${header()}<main class="panel"><h2>HOW IT WORKS</h2>
  <p><b>Playing:</b> you’re shown a place name. Tap the map where you think it is — drag to pan, scroll or pinch to zoom, and tap again to move your pin. Hit LOCK IN (or Enter) to score it.</p>
  <p><b>Scoring:</b> 100 points per drop. Within ${pack.perfectKm} km is a perfect 100, and the score halves for every ${pack.halfKm.toLocaleString()} km further away. Run out of time and your pin (if you placed one) is locked automatically; no pin means 0.</p>
  <p><b>Friends:</b> type several names on the home screen. Everyone plays the same drops in turn on the same device, then you compare on a shared map.</p>
  <p><b>Making your own:</b> choose EDIT GAME. Type a place and pick it from the suggestions (about 900 countries, capitals and big cities are built in) or tap the map to place anything — a pub, a school, a mountain. Set how strict the scoring is, add a timer, hide the borders for hard mode, or zoom the starting view to one region.</p>
  <p><b>Sharing:</b> EXPORT / SHARE downloads your game as one HTML file that anyone can double-click, with no install and no internet.</p>
  <div class="row"><button id="back">← BACK</button></div></main></div>`;
  wireHeader();$('#back').onclick=home;
}

/* ---------- play ---------- */
function startSession(){
  if(!complete()){alert('Some drops are missing a name or a map position. Open EDIT GAME and fix the ones marked ⚠.');return}
  const raw=($('#names')?$('#names').value:'').split(',').map(s=>s.trim()).filter(Boolean);
  const players=[...new Set(raw)].slice(0,10);if(!players.length)players.push('Player 1');
  store.set('md-names',raw.join(', '));
  S={players,pi:0,ri:0,res:players.map(()=>[]),phase:'ready',guess:null};
  drawPlay();
}
function startView(){
  if(pack.view)return MV.fit([pack.view.lo0,pack.view.la0,pack.view.lo1,pack.view.la1],20,60);
  return{cx:0,cy:8,k:MV.minK()};
}
function drawPlay(){
  cleanup();
  app.innerHTML=`<div class="stage"><canvas id="map"></canvas>
  <div class="hud top"><button id="quit" title="Quit to home">✕</button><div class="prompt" id="prompt"></div><div class="total" id="total"></div></div>
  <div class="hud bottom" id="bar"></div><div class="overlay" id="overlay"></div></div>`;
  MV=new MapView($('#map'),{borders:pack.borders});MV.set(startView(),false);
  $('#quit').onclick=()=>{if(confirm('Quit this game?'))home()};
  ready();
}
const curTotal=()=>S.res[S.pi].reduce((a,r)=>a+(r?r.score:0),0);
function updTotal(){$('#total').innerHTML=`<small>${esc(S.players[S.pi])}</small><b>${curTotal()}</b>`}
function ready(){
  S.phase='ready';MV.pins=[];MV.lines=[];MV.dirty=true;MV.set(startView(),true);updTotal();
  $('#prompt').innerHTML=`<small>${pack.rounds.length} drops</small><b>Get ready…</b>`;$('#bar').innerHTML='';
  const P=S.players[S.pi];
  $('#overlay').innerHTML=`<div class="card panel"><div class="eyebrow">${S.players.length>1?'PASS THE DEVICE TO':'READY?'}</div><h2 style="color:${PC(S.pi)}">${esc(P)}</h2><p>${pack.rounds.length} drops${pack.timer?` · ${pack.timer}s each`:''}. Closer pin = more points, 100 max per drop.</p><button class="go" id="start">START</button></div>`;
  $('#start').onclick=()=>{$('#overlay').innerHTML='';startGuess()};
}
function startGuess(){
  S.phase='guess';S.guess=null;const R=pack.rounds[S.ri];
  MV.pins=[];MV.lines=[];MV.set(startView(),true);updTotal();
  $('#prompt').innerHTML=`<small>${esc(S.players[S.pi])} · drop ${S.ri+1}/${pack.rounds.length}</small><b>${esc(R.name)}</b>${R.hint?`<em>${esc(R.hint)}</em>`:''}${pack.timer?'<div class="timer"><i></i><span></span></div>':''}`;
  $('#bar').innerHTML=`<span>Tap the map to drop your pin</span><button class="go" id="lock" disabled>LOCK IN</button>`;
  $('#lock').onclick=()=>lock(false);
  MV.o.onTap=(lo,la)=>{if(S.phase!=='guess')return;S.guess={lon:lo,lat:la};MV.pins=[{lon:lo,lat:la,color:PC(S.pi),r:9}];MV.dirty=true;$('#lock').disabled=false;$('#bar span').textContent='Tap again to move it, or lock it in';sfx.drop()};
  if(pack.timer>0){const end=performance.now()+pack.timer*1000,bar=$('.timer i'),tx=$('.timer span');clearInterval(TM);
    TM=setInterval(()=>{const left=end-performance.now();bar.style.width=Math.max(0,left/(pack.timer*1000)*100)+'%';tx.textContent=Math.ceil(Math.max(0,left)/1000)+'s';if(left<=0){clearInterval(TM);lock(true)}},100)}
}
function lock(timeout){
  if(S.phase!=='guess')return;clearInterval(TM);S.phase='reveal';
  const R=pack.rounds[S.ri];let rec;
  if(S.guess){const km=hav(S.guess.lat,S.guess.lon,R.lat,R.lon);rec={lat:S.guess.lat,lon:S.guess.lon,km,score:score(km)}}
  else rec={lat:null,lon:null,km:null,score:0};
  S.res[S.pi][S.ri]=rec;updTotal();
  MV.pins=[{lon:R.lon,lat:R.lat,color:'#58e28a',r:10,label:R.name}];MV.lines=[];
  if(rec.lat!==null){MV.pins.push({lon:rec.lon,lat:rec.lat,color:PC(S.pi),r:9});MV.lines=[{a:[rec.lon,rec.lat],b:[R.lon,R.lat],color:'#fff'}];
    MV.set(MV.fit([Math.min(rec.lon,R.lon),Math.min(rec.lat,R.lat),Math.max(rec.lon,R.lon),Math.max(rec.lat,R.lat)],90,25),true)}
  else MV.set(MV.fit([R.lon-8,R.lat-5,R.lon+8,R.lat+5],70,12),true);
  MV.dirty=true;
  const last=S.ri===pack.rounds.length-1,lastP=S.pi===S.players.length-1;
  $('#bar').innerHTML=`<div class="res"><b>+${rec.score}</b><span>${rec.km===null?'No pin placed':fmtKm(rec.km)+' away · '+rating(rec.score)}</span></div><button class="go" id="next">${last?(lastP?'FINAL SCORES →':'NEXT PLAYER →'):'NEXT DROP →'}</button>`;
  $('#next').onclick=nextStep;
  rec.score>=85?sfx.good():rec.score>=30?sfx.lock():sfx.bad();
}
function nextStep(){
  if(S.phase!=='reveal')return;
  S.ri++;
  if(S.ri>=pack.rounds.length){S.ri=0;S.pi++;if(S.pi>=S.players.length){results();return}ready();return}
  startGuess();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!S||!$('#bar')||(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)))return;
  if(S.phase==='guess'&&S.guess){e.preventDefault();lock(false)}else if(S.phase==='reveal'){e.preventDefault();nextStep()}
});

/* ---------- results ---------- */
function results(){
  cleanup();const n=pack.rounds.length;
  const tot=S.players.map((p,i)=>({p,i,t:S.res[i].reduce((a,r)=>a+r.score,0)})).sort((a,b)=>b.t-a.t);
  const max=Math.max(1,100*n);
  app.innerHTML=`<div class="shell">${header()}<div class="eyebrow">GAME OVER</div><h1>${esc(pack.title)}</h1>
  <div class="resgrid"><section class="panel"><h2>FINAL SCORES</h2>
   ${tot.map((x,r)=>`<div class="lb"><span class="rank">${r===0?'★':r+1+'.'}</span><span class="nm" style="color:${PC(x.i)}">${esc(x.p)}</span><span class="bar"><i style="width:${x.t/max*100}%;background:${PC(x.i)}"></i></span><span class="sc">${x.t}</span></div>`).join('')}
   <small>out of ${100*n}</small>
   <h3 style="margin-top:18px">DROP BY DROP</h3><div style="overflow-x:auto"><table><tr><th>Drop</th>${S.players.map((p,i)=>`<th style="color:${PC(i)}">${esc(p)}</th>`).join('')}</tr>
   ${pack.rounds.map((R,ri)=>`<tr><td>${ri+1}. ${esc(R.name)}</td>${S.players.map((p,pi)=>{const r=S.res[pi][ri];return`<td>${r.score}<small>${r.km===null?'no pin':fmtKm(r.km)}</small></td>`}).join('')}</tr>`).join('')}</table></div></section>
   <section class="panel mapwrap"><div class="tabs">${pack.rounds.map((R,i)=>`<button data-d="${i}">${i+1}</button>`).join('')}</div><canvas id="map"></canvas></section></div>
  <div class="row"><button class="go" id="again">▶ PLAY AGAIN</button><button id="home2">⌂ HOME</button></div></div>`;
  wireHeader();$('#again').onclick=()=>{const keep=S.players;S=null;home();$('#names').value=keep.join(', ');startSession()};$('#home2').onclick=home;
  MV=new MapView($('#map'),{borders:pack.borders});
  const review=i=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.d===i));const R=pack.rounds[i];
    MV.pins=[];MV.lines=[];const lo=[R.lon],la=[R.lat];
    S.players.forEach((p,pi)=>{const r=S.res[pi][i];if(r.lat===null)return;MV.lines.push({a:[r.lon,r.lat],b:[R.lon,R.lat],color:PC(pi)});MV.pins.push({lon:r.lon,lat:r.lat,color:PC(pi),r:8,label:S.players.length>1?p:''});lo.push(r.lon);la.push(r.lat)});
    MV.pins.push({lon:R.lon,lat:R.lat,color:'#58e28a',r:10,label:R.name});
    MV.set(MV.fit([Math.min(...lo),Math.min(...la),Math.max(...lo),Math.max(...la)],70,25),true);MV.dirty=true};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>review(+b.dataset.d));
  review(0);S.phase='done';
  if(tot[0].t>=0)sfx.good();
}

/* ---------- editor ---------- */
let sel=0,placing=false;
function editor(){
  cleanup();S=null;if(sel>=pack.rounds.length)sel=0;placing=false;
  app.innerHTML=`<div class="shell" style="max-width:1300px">${header()}<div class="edgrid"><div class="panel" id="edL"></div><div class="edmap"><canvas id="map"></canvas><div class="maphint" id="mh"></div></div></div></div>`;
  wireHeader();
  MV=new MapView($('#map'),{borders:pack.borders,onTap:(lo,la)=>{
    if(!placing)return;const r=pack.rounds[sel];if(!r)return;
    r.lat=Math.round(la*1000)/1000;r.lon=Math.round(lo*1000)/1000;placing=false;changed();renderL();syncPins();sfx.drop()}});
  if(pack.view)MV.set(MV.fit([pack.view.lo0,pack.view.la0,pack.view.lo1,pack.view.la1],20,60),false);
  renderL();syncPins();
}
function syncPins(){
  if(!MV)return;MV.borders=pack.borders;
  MV.pins=pack.rounds.map((r,i)=>r.lat===null?null:{lon:r.lon,lat:r.lat,color:i===sel?'#ffd45a':'#58e28a',r:i===sel?10:7,label:(i+1)+(r.name?' '+r.name:'')}).filter(Boolean);
  const mh=$('#mh');if(mh){const r=pack.rounds[sel];mh.textContent=placing?`Tap the map to place: ${r&&r.name||'drop '+(sel+1)}`:'Drag to pan · scroll or pinch to zoom · yellow pin = selected drop';mh.style.color=placing?'#ffd45a':''}
  MV.cv.style.cursor=placing?'crosshair':'grab';MV.dirty=true;
}
function renderL(){
  const L=$('#edL'),p=pack;
  L.innerHTML=`<div class="eyebrow">GAME EDITOR${isShared?' · (this file has a built-in game)':''}</div>
  <label for="f-title">Game title</label><input id="f-title" data-f="title" maxlength="80" value="${esc(p.title)}">
  <label for="f-desc">Description</label><textarea id="f-desc" data-f="description" maxlength="400">${esc(p.description)}</textarea>
  <label>Scoring strictness</label><div class="seg"><button class="sm" data-act="preset" data-v="2500">EASY (world)</button><button class="sm" data-act="preset" data-v="1200">NORMAL</button><button class="sm" data-act="preset" data-v="400">HARD (region)</button><button class="sm" data-act="preset" data-v="80">CITY-LEVEL</button></div>
  <div class="grid2"><div><label for="f-half">Score halves every (km)</label><input id="f-half" type="number" min="10" max="20000" data-f="halfKm" value="${p.halfKm}"></div>
  <div><label for="f-perf">Perfect within (km)</label><input id="f-perf" type="number" min="0" max="2000" data-f="perfectKm" value="${p.perfectKm}"></div>
  <div><label for="f-timer">Timer per drop (s, 0 = none)</label><input id="f-timer" type="number" min="0" max="300" data-f="timer" value="${p.timer}"></div>
  <div><label for="f-bord">Country borders</label><select id="f-bord" data-f="borders"><option value="on" ${p.borders?'selected':''}>Show (easier)</option><option value="off" ${p.borders?'':'selected'}>Hide (hard mode)</option></select></div></div>
  <label>Starting view</label><div class="seg"><button class="sm" data-act="setview">USE CURRENT MAP VIEW</button><button class="sm" data-act="resetview">WORLD</button></div>
  <small>${p.view?'Zoomed to a custom region — handy for a game about just one country or city.':'Whole world.'}</small>
  <h3 style="margin-top:20px">DROPS (${p.rounds.length}/60)</h3>
  ${p.rounds.map((r,i)=>{const open=i===sel,miss=!r.name.trim()||r.lat===null;return`<div class="loc ${open?'sel':''}"><div class="head" data-act="sel" data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(r.name||'(unnamed)')} ${r.lat===null?'<span class="warn">⚠ not on map</span>':!r.name.trim()?'<span class="warn">⚠ no name</span>':''}</span><small>${r.lat===null?'':r.lat.toFixed(1)+', '+r.lon.toFixed(1)}</small></div>
  ${open?`<div class="body"><label for="r-name">Name shown to players</label><input id="r-name" data-r="name" maxlength="80" autocomplete="off" placeholder="Type a place — suggestions fill in the position" value="${esc(r.name)}"><div class="sug" id="sug"></div>
  <label for="r-hint">Hint (optional)</label><input id="r-hint" data-r="hint" maxlength="160" placeholder="e.g. ‘where we had the 2019 wedding’" value="${esc(r.hint)}">
  <div class="grid2"><div><label for="r-lat">Latitude</label><input id="r-lat" type="number" step="any" min="-90" max="90" data-r="lat" value="${r.lat===null?'':r.lat}"></div><div><label for="r-lon">Longitude</label><input id="r-lon" type="number" step="any" min="-180" max="180" data-r="lon" value="${r.lon===null?'':r.lon}"></div></div>
  <div class="row"><button class="sm ${placing?'go':''}" data-act="place">${placing?'TAP THE MAP…':'📍 PLACE BY TAPPING MAP'}</button><button class="sm" data-act="up" ${i===0?'disabled':''}>↑</button><button class="sm" data-act="down" ${i===p.rounds.length-1?'disabled':''}>↓</button><button class="sm danger" data-act="del">DELETE</button></div></div>`:''}</div>`}).join('')}
  <div class="row"><button class="sm" data-act="add" ${p.rounds.length>=60?'disabled':''}>+ ADD DROP</button></div>
  <div class="tip">Your work saves in this browser automatically. When it’s ready, use EXPORT / SHARE to get a file for your friends.</div>
  <div class="row"><button class="go" data-act="play">▶ TEST PLAY</button><button data-act="share">⇩ EXPORT / SHARE</button><button data-act="import">⇧ IMPORT</button><button class="danger sm" data-act="reset">RESET</button></div>
  <input type="file" id="file" accept=".json,.html,application/json,text/html" hidden>`;
}
function suggest(q){
  const box=$('#sug');if(!box)return;q=q.trim().toLowerCase();if(q.length<2){box.innerHTML='';return}
  const hits=[];GAZ.forEach((g,i)=>{const n=g[0].toLowerCase();if(n.startsWith(q))hits.push([0,i]);else if(n.includes(q))hits.push([1,i])});
  hits.sort((a,b)=>a[0]-b[0]);
  box.innerHTML=hits.slice(0,6).map(([,i])=>`<button data-act="gaz" data-g="${i}">${esc(GAZ[i][0])} <small>${esc(GAZ[i][3])}</small></button>`).join('');
}
document.addEventListener('input',e=>{
  const t=e.target;if(!$('#edL')||!$('#edL').contains(t))return;
  if(t.dataset.f){const f=t.dataset.f;
    if(f==='borders')pack.borders=t.value==='on';
    else if(f==='title'||f==='description')pack[f]=t.value;
    else{let v=Number(t.value);if(!Number.isFinite(v))return;pack[f]=f==='timer'?Math.round(Math.max(0,Math.min(300,v))):Math.max(f==='halfKm'?10:0,v)}
    changed();syncPins()}
  else if(t.dataset.r){const f=t.dataset.r,r=pack.rounds[sel];if(!r)return;
    if(f==='lat'||f==='lon'){const v=t.value===''?null:Number(t.value);r[f]=v===null||!Number.isFinite(v)?null:Math.max(f==='lat'?-90:-180,Math.min(f==='lat'?90:180,v))}
    else r[f]=t.value;
    if(f==='name')suggest(t.value);
    changed();syncPins();const head=document.querySelector('.loc.sel .head .t');if(head&&f==='name')head.firstChild.textContent=(r.name||'(unnamed)')+' '}
});
document.addEventListener('change',e=>{if(e.target.id==='file'&&e.target.files[0])doImport(e.target.files[0])});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!$('#edL')||!$('#edL').contains(b))return;
  const act=b.dataset.act,r=pack.rounds[sel];
  const redraw=()=>{changed();renderL();syncPins()};
  if(act==='sel'){sel=+b.dataset.i;placing=false;renderL();syncPins();const q=pack.rounds[sel];if(q&&q.lat!==null)MV.set({cx:q.lon,cy:q.lat,k:Math.max(MV.k,4)},true)}
  else if(act==='add'){if(pack.rounds.length<60){pack.rounds.push({name:'',hint:'',lat:null,lon:null});sel=pack.rounds.length-1;placing=false;redraw();const n=$('#r-name');if(n)n.focus()}}
  else if(act==='del'){if(!r)return;if(!r.name&&r.lat===null||confirm('Delete “'+(r.name||'this drop')+'”?')){pack.rounds.splice(sel,1);sel=Math.max(0,Math.min(sel,pack.rounds.length-1));placing=false;redraw()}}
  else if(act==='up'&&sel>0){[pack.rounds[sel-1],pack.rounds[sel]]=[pack.rounds[sel],pack.rounds[sel-1]];sel--;redraw()}
  else if(act==='down'&&sel<pack.rounds.length-1){[pack.rounds[sel+1],pack.rounds[sel]]=[pack.rounds[sel],pack.rounds[sel+1]];sel++;redraw()}
  else if(act==='place'){placing=!placing;renderL();syncPins()}
  else if(act==='gaz'){const g=GAZ[+b.dataset.g];if(!r)return;r.name=g[0];r.lat=g[1];r.lon=g[2];placing=false;redraw();MV.set({cx:g[2],cy:g[1],k:Math.max(MV.k,6)},true)}
  else if(act==='preset'){pack.halfKm=+b.dataset.v;redraw()}
  else if(act==='setview'){const bd=MV.bounds();pack.view={lo0:Math.max(-180,bd[0]),la0:Math.max(-90,bd[1]),lo1:Math.min(180,bd[2]),la1:Math.min(90,bd[3])};redraw()}
  else if(act==='resetview'){pack.view=null;redraw();MV.world()}
  else if(act==='play'){if(!complete()){alert('Some drops are missing a name or a map position (marked ⚠).');return}changed();home();setTimeout(startSession,0)}
  else if(act==='share'){changed();share()}
  else if(act==='import'){$('#file').click()}
  else if(act==='reset'){if(confirm('Replace your game with the demo game? This cannot be undone.')){pack=clone(DEFAULT);sel=0;redraw()}}
});
function doImport(file){
  const fr=new FileReader();fr.onload=()=>{try{let t=String(fr.result);
    if(/^\s*</.test(t)){const m=t.match(new RegExp('id="embedded-pack" type="application/json">([\\s\\S]*?)</scr'+'ipt>','i'));if(!m||m[1].trim()==='null')throw 'That HTML file has no built-in game.';t=m[1]}
    pack=validate(JSON.parse(t));sel=0;changed();renderL();syncPins()}catch(err){alert(typeof err==='string'?err:'Could not read that file.')}};
  fr.readAsText(file);
}

/* ---------- export ---------- */
function portableHTML(){
  const j=JSON.stringify(pack).replace(/</g,'\\u003c');
  const marker='<script id="embedded-pack" type="application/json">',i=ORIGINAL.indexOf(marker),e=ORIGINAL.indexOf('</scr'+'ipt>',i);
  return ORIGINAL.slice(0,i+marker.length)+j+ORIGINAL.slice(e);
}
function share(){
  cleanup();S=null;const ok=complete();
  app.innerHTML=`<div class="shell">${header()}<main class="panel"><h2>EXPORT / SHARE</h2>
  ${ok?'':'<p class="warn">⚠ Some drops are missing a name or position. Finish them in the editor first.</p>'}
  <p>Your game: <b>${esc(pack.title)}</b> — ${pack.rounds.length} drops.</p>
  <div class="row"><button class="go" id="dlHtml" ${ok?'':'disabled'}>⇩ DOWNLOAD PLAYABLE GAME (.html)</button><button id="dlJson" ${ok?'':'disabled'}>⇩ DOWNLOAD GAME DATA (.json)</button></div>
  <div class="tip"><b>Send friends the .html file.</b> They double-click it and it opens in their browser — no install, no internet. The .json is a tiny backup you can load back in with IMPORT in the editor.</div>
  <div class="tip"><b>Put it on a website (GitHub Pages):</b> rename the downloaded file to <b>index.html</b> and upload it to your repository, replacing the old one. Or give it a different name to keep several games side by side.</div>
  <div class="tip">⚠ The file contains every answer. Don’t send it to people before they play.</div>
  <div class="row"><button id="back">← BACK TO EDITOR</button></div></main></div>`;
  wireHeader();$('#back').onclick=editor;
  $('#dlHtml').onclick=()=>download(slug(pack.title)+'.html',portableHTML(),'text/html');
  $('#dlJson').onclick=()=>download(slug(pack.title)+'.json',JSON.stringify(pack,null,1),'application/json');
}

home();
</script></body></html>
